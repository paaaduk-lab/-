<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🌷 우리들의 작은 도구함</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Gowun+Dodum&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #fbf7f0;
    --paper: #fffdf9;
    --ink: #5a4e46;
    --ink-soft: #8f8178;
    --line: #efe4d6;
    --pink: #f6d6d6;
    --pink-deep: #e8a9a9;
    --mint: #d4ebe0;
    --mint-deep: #93c7ae;
    --butter: #f8ebc4;
    --butter-deep: #e3c66f;
    --sky: #d7e6f2;
    --sky-deep: #94b8d6;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Gowun Dodum', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
    background-color: var(--bg);
    background-image: radial-gradient(#ead9c6 1.2px, transparent 1.2px);
    background-size: 22px 22px;
    color: var(--ink);
    min-height: 100vh;
    padding: 48px 20px 40px;
    line-height: 1.6;
  }
  .wrap { max-width: 760px; margin: 0 auto; }

  header { text-align: center; margin-bottom: 40px; position: relative; }
  .badge {
    display: inline-block;
    background: var(--paper);
    border: 2px dashed var(--pink-deep);
    border-radius: 999px;
    padding: 4px 16px;
    font-size: 14px;
    color: var(--ink-soft);
    margin-bottom: 14px;
  }
  h1 {
    font-family: 'Jua', sans-serif;
    font-weight: 400;
    font-size: clamp(30px, 6vw, 42px);
    letter-spacing: 1px;
  }
  h1 .hl {
    background: linear-gradient(transparent 60%, var(--butter) 60%);
    padding: 0 4px;
  }
  .sub { color: var(--ink-soft); margin-top: 8px; font-size: 16px; }
  .float { position: absolute; font-size: 26px; animation: bob 3.2s ease-in-out infinite; opacity: .85; }
  .f1 { left: 4%; top: 6px; }
  .f2 { right: 6%; top: 30px; animation-delay: 1.1s; }
  @keyframes bob { 0%,100% { transform: translateY(0) rotate(-6deg); } 50% { transform: translateY(-8px) rotate(6deg); } }

  section {
    background: var(--paper);
    border: 2px solid var(--line);
    border-radius: 28px;
    padding: 26px 24px 28px;
    margin-bottom: 26px;
    box-shadow: 0 6px 0 var(--line);
  }
  .sec-title {
    display: flex; align-items: center; gap: 10px;
    font-family: 'Jua', sans-serif;
    font-size: 24px;
    margin-bottom: 18px;
  }
  .sec-title .dot {
    width: 38px; height: 38px; border-radius: 50%;
    display: grid; place-items: center; font-size: 20px;
  }
  .fun .dot { background: var(--pink); }
  .work .dot { background: var(--sky); }
  .sec-title small {
    font-family: 'Gowun Dodum', sans-serif;
    font-size: 14px; color: var(--ink-soft); margin-left: auto;
  }

  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 16px; }
  .card {
    position: relative;
    display: flex; flex-direction: column; align-items: flex-start; gap: 6px;
    text-decoration: none; color: var(--ink);
    background: var(--c);
    border: 2px solid var(--cd);
    border-radius: 22px;
    padding: 20px 18px 18px;
    box-shadow: 0 5px 0 var(--cd);
    transition: transform .18s ease, box-shadow .18s ease;
  }
  .card:hover, .card:focus-visible {
    transform: translateY(-4px);
    box-shadow: 0 9px 0 var(--cd);
    outline: none;
  }
  .card:active { transform: translateY(3px); box-shadow: 0 2px 0 var(--cd); }
  .card .ico {
    font-size: 34px; width: 58px; height: 58px; border-radius: 18px;
    background: rgba(255,255,255,.7);
    display: grid; place-items: center;
    margin-bottom: 4px;
  }
  .card:hover .ico { animation: wiggle .5s ease; }
  @keyframes wiggle { 25% { transform: rotate(-10deg); } 75% { transform: rotate(10deg); } }
  .card h3 { font-family: 'Jua', sans-serif; font-weight: 400; font-size: 20px; }
  .card p { font-size: 14px; color: var(--ink-soft); }
  .card .go {
    position: absolute; right: 16px; top: 18px;
    font-size: 13px; background: var(--paper);
    border-radius: 999px; padding: 2px 10px;
    color: var(--ink-soft);
  }
  .pink { --c: var(--pink); --cd: var(--pink-deep); }
  .mint { --c: var(--mint); --cd: var(--mint-deep); }
  .butter { --c: var(--butter); --cd: var(--butter-deep); }
  .sky { --c: var(--sky); --cd: var(--sky-deep); }

  footer { text-align: center; color: var(--ink-soft); font-size: 14px; margin-top: 10px; }

  @media (prefers-reduced-motion: reduce) {
    .float, .card:hover .ico { animation: none; }
    .card { transition: none; }
  }
</style>
</head>
<body>
  <div class="wrap">
    <header>
      <span class="float f1">🌼</span>
      <span class="float f2">☁️</span>
      <div class="badge">✿ 오늘도 좋은 하루 ✿</div>
      <h1>우리들의 <span class="hl">작은 도구함</span></h1>
      <p class="sub">필요한 걸 콕 눌러서 바로 써 보세요 🐾</p>
    </header>

    <section class="fun">
      <div class="sec-title">
        <span class="dot">🎈</span> 재미
        <small>잠깐 쉬어가요</small>
      </div>
      <div class="grid">
        <a class="card pink" href="사다리타기.html">
          <span class="go">열기 →</span>
          <span class="ico">🪜</span>
          <h3>사다리타기</h3>
          <p>두근두근, 누가 걸릴까?</p>
        </a>
        <a class="card butter" href="교육장%20룰렛%20추첨기.html">
          <span class="go">열기 →</span>
          <span class="ico">🎡</span>
          <h3>룰렛 추첨기</h3>
          <p>빙글빙글 돌려서 공정하게!</p>
        </a>
        <a class="card mint" href="https://script.google.com/macros/s/AKfycbzhmRgUbfood2fEin61-JsD-ybL9k1phD6WEK_3IFTb2VGkQuC1qyLTbPnqnkOQuGdpHw/exec" target="_blank" rel="noopener">
          <span class="go">새 창 ↗</span>
          <span class="ico">🍱</span>
          <h3>날씨 기반 점심 고르기</h3>
          <p>오늘 날씨엔 뭐가 맛있을까?</p>
        </a>
        <a class="card sky" href="두근두근%20여행%20플래너%20✈.html">
          <span class="go">열기 →</span>
          <span class="ico">✈️</span>
          <h3>여행일정</h3>
          <p>두근두근, 어디로 떠나볼까?</p>
        </a>
      </div>
    </section>

    <section class="work">
      <div class="sec-title">
        <span class="dot">📎</span> 업무
        <small>일은 빠르고 간단하게</small>
      </div>
      <div class="grid">
        <a class="card sky" href="PDF_병합분할기.html">
          <span class="go">열기 →</span>
          <span class="ico">📄</span>
          <h3>PDF 병합도구</h3>
          <p>여러 PDF를 하나로, 하나를 여럿으로</p>
        </a>
      </div>
    </section>

    <footer>made with 🧡 · 작은 도구함</footer>
  </div>
</body>
</html>
