<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>두근두근 여행 플래너 ✈️</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Gowun+Dodum&display=swap" rel="stylesheet">
<style>
  :root{
    --sky:#bfe6ff; --sky2:#e9f6ff; --pink:#ff8fb1; --pink2:#ffd6e3;
    --yellow:#ffd96a; --mint:#7fdcc0; --mint2:#d8f7ee; --violet:#a99bff;
    --ink:#3b3355; --soft:#7a7196; --card:#ffffff;
    --shadow:0 8px 0 rgba(59,51,85,.08), 0 14px 30px rgba(59,51,85,.10);
  }
  *{box-sizing:border-box}
  body{
    margin:0; font-family:'Gowun Dodum',sans-serif; color:var(--ink);
    background:linear-gradient(180deg,var(--sky) 0%,var(--sky2) 45%,#fff7fb 100%);
    min-height:100vh; overflow-x:hidden;
  }
  h1,h2,h3,.jua{font-family:'Jua',sans-serif;font-weight:400}

  /* 떠다니는 구름 & 비행기 */
  .sky{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
  .cloud{position:absolute;background:#fff;border-radius:100px;opacity:.85;animation:drift linear infinite}
  .cloud::before,.cloud::after{content:"";position:absolute;background:#fff;border-radius:50%}
  .cloud::before{width:55%;height:160%;left:12%;top:-70%}
  .cloud::after{width:40%;height:130%;right:12%;top:-50%}
  @keyframes drift{from{transform:translateX(-30vw)}to{transform:translateX(130vw)}}
  .plane{position:absolute;font-size:34px;top:12%;animation:fly 18s linear infinite}
  @keyframes fly{
    0%{transform:translateX(-10vw) translateY(0) rotate(8deg)}
    50%{transform:translateX(55vw) translateY(-30px) rotate(-4deg)}
    100%{transform:translateX(115vw) translateY(10px) rotate(8deg)}
  }

  .wrap{position:relative;z-index:1;max-width:880px;margin:0 auto;padding:28px 18px 80px}

  header{text-align:center;margin:10px 0 26px}
  .badge{display:inline-block;background:#fff;padding:6px 14px;border-radius:999px;font-size:14px;color:var(--soft);box-shadow:var(--shadow)}
  header h1{font-size:clamp(34px,7vw,56px);margin:14px 0 6px;color:var(--ink);letter-spacing:-1px}
  header h1 .bounce{display:inline-block;animation:bounce 1.6s ease-in-out infinite}
  header h1 .bounce:nth-child(2){animation-delay:.15s}
  header h1 .bounce:nth-child(3){animation-delay:.3s}
  @keyframes bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
  header p{margin:0;color:var(--soft);font-size:17px}

  .card{background:var(--card);border-radius:28px;padding:24px;box-shadow:var(--shadow);margin-bottom:22px;border:3px solid #fff}
  .card h2{margin:0 0 14px;font-size:24px;display:flex;align-items:center;gap:8px}

  label{font-size:14px;color:var(--soft);display:block;margin-bottom:6px}
  input,select{
    width:100%;font:inherit;font-size:16px;color:var(--ink);
    padding:12px 14px;border-radius:16px;border:2.5px solid #ece8f7;background:#fbfaff;outline:none;transition:.2s
  }
  input:focus,select:focus{border-color:var(--pink);background:#fff;box-shadow:0 0 0 5px var(--pink2)}
  .grid{display:grid;gap:14px}
  .g2{grid-template-columns:1fr 1fr}
  .g3{grid-template-columns:repeat(3,1fr)}
  @media(max-width:640px){.g2,.g3{grid-template-columns:1fr}}

  /* 여행지 리스트 */
  .dest-list{display:flex;flex-direction:column;gap:10px}
  .dest{display:flex;align-items:center;gap:10px;animation:pop .35s ease}
  @keyframes pop{from{transform:scale(.85);opacity:0}to{transform:scale(1);opacity:1}}
  .dest .num{
    flex:0 0 40px;height:40px;border-radius:50%;display:grid;place-items:center;
    font-family:'Jua';font-size:18px;color:#fff;box-shadow:0 4px 0 rgba(0,0,0,.08)
  }
  .dest input{flex:1}
  .del{
    flex:0 0 40px;height:40px;border-radius:14px;border:none;cursor:pointer;
    background:#fff0f4;color:var(--pink);font-size:20px;transition:.2s
  }
  .del:hover{background:var(--pink);color:#fff;transform:rotate(90deg)}
  .del:disabled{opacity:.3;cursor:not-allowed;transform:none;background:#fff0f4;color:var(--pink)}
  .add{
    margin-top:12px;width:100%;padding:12px;border-radius:16px;cursor:pointer;
    border:2.5px dashed var(--mint);background:var(--mint2);color:#2c8f73;font:inherit;font-size:16px;transition:.2s
  }
  .add:hover{background:var(--mint);color:#fff;border-style:solid}

  .go{
    display:block;width:100%;padding:18px;border:none;border-radius:22px;cursor:pointer;
    font-family:'Jua';font-size:24px;color:#fff;
    background:linear-gradient(135deg,var(--pink),#ffb36b);
    box-shadow:0 7px 0 #e46a92, 0 16px 30px rgba(255,120,160,.35);transition:.15s
  }
  .go:hover{transform:translateY(-2px)}
  .go:active{transform:translateY(5px);box-shadow:0 2px 0 #e46a92}
  .go:disabled{filter:grayscale(.5);cursor:wait}
  .sub-actions{display:flex;justify-content:center;gap:14px;margin-top:12px;flex-wrap:wrap}
  .link-btn{background:none;border:none;color:var(--soft);font:inherit;font-size:14px;cursor:pointer;text-decoration:underline dotted}

  details.api{background:#fffbea;border-radius:18px;padding:12px 16px;border:2px solid #fff1b8}
  details.api summary{cursor:pointer;font-family:'Jua';font-size:17px}
  .hint{font-size:13px;color:var(--soft);margin-top:6px;line-height:1.5}

  /* 로딩 */
  .loading{display:none;text-align:center;padding:30px 10px}
  .loading.on{display:block}
  .suitcase{font-size:64px;display:inline-block;animation:wiggle .6s ease-in-out infinite}
  @keyframes wiggle{0%,100%{transform:rotate(-8deg)}50%{transform:rotate(8deg) translateY(-6px)}}
  .loading p{font-family:'Jua';font-size:20px;margin:10px 0 0}

  .error{display:none;background:#fff0f4;border:2px solid var(--pink2);color:#c23e6a;border-radius:18px;padding:14px 18px;margin-bottom:20px}
  .error.on{display:block}

  /* 결과 */
  .plan{animation:slideUp .6s ease both}
  .plan:nth-of-type(2){animation-delay:.15s}
  @keyframes slideUp{from{transform:translateY(30px);opacity:0}to{transform:translateY(0);opacity:1}}
  .plan-head{
    border-radius:28px 28px 0 0;padding:22px 24px;color:#fff;position:relative;overflow:hidden
  }
  .plan-head .tag{display:inline-block;background:rgba(255,255,255,.3);border-radius:999px;padding:4px 12px;font-size:14px}
  .plan-head h2{margin:8px 0 4px;font-size:28px}
  .plan-head p{margin:0;opacity:.95;line-height:1.5}
  .plan-head .deco{position:absolute;right:18px;top:10px;font-size:64px;opacity:.35;transform:rotate(12deg)}
  .p1 .plan-head{background:linear-gradient(135deg,#ff8fb1,#ffb36b)}
  .p2 .plan-head{background:linear-gradient(135deg,#7f9bff,#a99bff)}
  .plan-body{background:#fff;border-radius:0 0 28px 28px;padding:22px 24px;box-shadow:var(--shadow);margin-bottom:30px}

  .route{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin-bottom:18px}
  .route span.stop{background:#f4f1ff;border-radius:999px;padding:6px 12px;font-size:14px}
  .route span.arrow{color:var(--soft)}

  .day{border-left:4px dashed #e6e0f8;padding-left:18px;margin:0 0 18px 10px;position:relative}
  .day::before{
    content:attr(data-day);position:absolute;left:-23px;top:-2px;
    background:var(--yellow);color:var(--ink);font-family:'Jua';font-size:13px;
    width:42px;height:26px;border-radius:999px;display:grid;place-items:center;transform:translateX(-50%) translateX(21px)
  }
  .day h3{margin:0 0 10px;padding-left:30px;font-size:19px}
  .stop-item{display:flex;gap:12px;padding:10px 12px;border-radius:14px;margin-bottom:6px;background:#fcfbff;transition:.2s}
  .stop-item:hover{background:#fff4f8;transform:translateX(4px)}
  .stop-item .time{flex:0 0 64px;font-family:'Jua';color:var(--pink);font-size:15px}
  .stop-item b{display:block;margin-bottom:2px}
  .stop-item small{color:var(--soft);line-height:1.5}

  .section-title{display:flex;align-items:center;gap:8px;font-family:'Jua';font-size:21px;margin:26px 0 12px}
  .section-title::after{content:"";flex:1;height:3px;border-radius:3px;background:repeating-linear-gradient(90deg,#e6e0f8 0 8px,transparent 8px 14px)}

  .tr-list{display:flex;flex-direction:column;gap:8px}
  .tr{display:grid;grid-template-columns:44px 1fr auto;gap:12px;align-items:center;padding:12px 14px;border-radius:16px;background:var(--mint2)}
  .tr .ico{font-size:26px;text-align:center}
  .tr .seg{font-weight:bold}
  .tr small{color:var(--soft)}
  .tr .price{font-family:'Jua';font-size:17px;color:#2c8f73;white-space:nowrap}

  .cost-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
  @media(max-width:640px){.cost-grid{grid-template-columns:repeat(2,1fr)}}
  .cost{background:#fffbea;border-radius:18px;padding:14px;text-align:center}
  .cost .e{font-size:26px}
  .cost .l{font-size:13px;color:var(--soft)}
  .cost .v{font-family:'Jua';font-size:18px;margin-top:4px}
  .total{
    margin-top:12px;border-radius:20px;padding:16px 20px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;
    background:linear-gradient(135deg,#fff3c4,#ffe0ec)
  }
  .total .l{font-family:'Jua';font-size:19px}
  .total .v{font-family:'Jua';font-size:28px;color:#e2577f}
  .total small{display:block;color:var(--soft);font-family:'Gowun Dodum';font-size:13px}

  .tips{margin-top:16px;background:#f4f1ff;border-radius:18px;padding:14px 18px;line-height:1.7}
  .tips b{font-family:'Jua';font-weight:400}

  .confetti{position:fixed;top:-20px;font-size:22px;z-index:50;pointer-events:none;animation:fall linear forwards}
  @keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}

  footer{text-align:center;color:var(--soft);font-size:13px;margin-top:30px}
</style>
</head>
<body>

<div class="sky" id="sky">
  <div class="plane">✈️</div>
</div>

<div class="wrap">
  <header>
    <span class="badge">🧳 짐 싸기 전에 일정부터!</span>
    <h1><span class="bounce">두근</span><span class="bounce">두근</span> <span class="bounce">여행 플래너</span></h1>
    <p>가고 싶은 곳만 적어 주세요. 동선 좋은 일정 2가지를 뚝딱 짜 드릴게요 💖</p>
  </header>

  <!-- 기본 정보 -->
  <section class="card">
    <h2>🌈 여행 기본 정보</h2>
    <div class="grid g3">
      <div><label>🏠 출발지</label><input id="origin" placeholder="예: 서울" value="서울"></div>
      <div><label>📅 여행 기간 (일)</label><input id="days" type="number" min="1" max="30" value="3"></div>
      <div><label>👫 인원</label><input id="people" type="number" min="1" max="20" value="2"></div>
    </div>
    <div class="grid g2" style="margin-top:14px">
      <div><label>🗓️ 출발 예정일 (선택)</label><input id="date" type="date"></div>
      <div>
        <label>🎒 여행 스타일</label>
        <select id="style">
          <option>골고루 다 좋아요</option>
          <option>맛집 탐방 위주</option>
          <option>자연·힐링 위주</option>
          <option>관광·명소 위주</option>
          <option>가성비 알뜰 여행</option>
          <option>럭셔리 여행</option>
        </select>
      </div>
    </div>
  </section>

  <!-- 여행지 -->
  <section class="card">
    <h2>📍 가고 싶은 여행지</h2>
    <div class="dest-list" id="destList"></div>
    <button class="add" id="addBtn">＋ 여행지 하나 더 추가하기</button>
    <p class="hint">빈칸은 자동으로 빠져요. 도시·관광지·맛집 이름 모두 OK!</p>
  </section>


  <button class="go" id="goBtn">✨ 일정 추천받기 ✨</button>
  <div class="sub-actions">
    <button class="link-btn" id="demoBtn">🎈 예시 결과 미리보기</button>
  </div>

  <div style="height:26px"></div>
  <div class="error" id="error"></div>
  <div class="loading" id="loading">
    <div class="suitcase">🧳</div>
    <p id="loadMsg">짐 싸는 중...</p>
  </div>
  <div id="result"></div>

  <footer>예상 금액은 AI 추정치예요. 예약 전에 실제 요금을 꼭 확인하세요 🙏</footer>
</div>

<script>
const COLORS = ['#ff8fb1','#ffb36b','#7fdcc0','#7f9bff','#a99bff','#ffd96a','#6cc8ff'];
const DEFAULT_COUNT = 5;
const examples = ['도쿄','오사카','교토','나라','고베','후쿠오카','삿포로'];

/* ---------- 구름 ---------- */
(function makeClouds(){
  const sky = document.getElementById('sky');
  for(let i=0;i<6;i++){
    const c = document.createElement('div');
    c.className='cloud';
    const w = 80 + Math.random()*120;
    c.style.width = w+'px'; c.style.height = w*0.35+'px';
    c.style.top = (5 + Math.random()*80)+'%';
    c.style.animationDuration = (40 + Math.random()*40)+'s';
    c.style.animationDelay = (-Math.random()*60)+'s';
    sky.appendChild(c);
  }
})();

/* ---------- 여행지 입력 ---------- */
const list = document.getElementById('destList');
function renumber(){
  const rows = [...list.children];
  rows.forEach((r,i)=>{
    const n = r.querySelector('.num');
    n.textContent = i+1;
    n.style.background = COLORS[i % COLORS.length];
    r.querySelector('input').placeholder = `예: ${examples[i % examples.length]}`;
  });
  rows.forEach(r=> r.querySelector('.del').disabled = rows.length <= 1);
}
function addDest(val=''){
  const row = document.createElement('div');
  row.className='dest';
  row.innerHTML = `<div class="num"></div><input value="${val}"><button class="del" title="삭제">✕</button>`;
  row.querySelector('.del').onclick = ()=>{ row.remove(); renumber(); };
  list.appendChild(row);
  renumber();
  return row;
}
for(let i=0;i<DEFAULT_COUNT;i++) addDest();
document.getElementById('addBtn').onclick = ()=> addDest().querySelector('input').focus();


/* ---------- 유틸 ---------- */
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const won = n => (typeof n === 'number' && isFinite(n)) ? Math.round(n).toLocaleString('ko-KR')+'원' : esc(n || '-');
function modeIcon(m=''){
  m = m.toLowerCase();
  if(/비행|항공|flight|plane/.test(m)) return '✈️';
  if(/ktx|srt|신칸센|고속철/.test(m)) return '🚄';
  if(/기차|열차|철도|train|rail|jr/.test(m)) return '🚆';
  if(/지하철|메트로|subway|metro/.test(m)) return '🚇';
  if(/버스|bus/.test(m)) return '🚌';
  if(/택시|taxi|우버|그랩/.test(m)) return '🚕';
  if(/렌터|렌트|자동차|차량|car|드라이브/.test(m)) return '🚗';
  if(/배|페리|선박|ferry|boat|크루즈/.test(m)) return '⛴️';
  if(/도보|걷|walk/.test(m)) return '🚶';
  if(/자전거|bike/.test(m)) return '🚲';
  return '🧭';
}
function confetti(){
  const items = ['🎉','✨','💖','🌸','⭐','🎈','✈️'];
  for(let i=0;i<36;i++){
    const s = document.createElement('div');
    s.className='confetti';
    s.textContent = items[i % items.length];
    s.style.left = Math.random()*100+'vw';
    s.style.animationDuration = (2 + Math.random()*2)+'s';
    s.style.animationDelay = Math.random()*.6+'s';
    document.body.appendChild(s);
    setTimeout(()=>s.remove(), 5000);
  }
}

/* ---------- 프롬프트 ---------- */
function buildPrompt(info){
  return `다음 조건으로 효율적인 여행 일정 2가지를 추천해 주세요.

- 출발지: ${info.origin || '미정'}
- 여행 기간: ${info.days}일
- 인원: ${info.people}명
- 출발 예정일: ${info.date || '미정'}
- 여행 스타일: ${info.style}
- 가고 싶은 여행지(${info.dests.length}곳): ${info.dests.join(', ')}

요구사항:
1. 두 일정은 서로 성격이 달라야 합니다. 일정1은 "동선 최적화·시간 효율" 중심, 일정2는 "여유·가성비" 중심 등으로 차별화하세요.
2. 입력한 여행지를 지리적으로 효율적인 순서로 배치하고, 일자별 시간대 일정을 짜 주세요.
3. 각 일정에 맞는 구간별 교통수단(출발지 왕복 포함)과 1인 기준 예상 요금(원화, 숫자)을 제시하세요.
4. 예상 비용(교통/숙박/식비/관광·입장료)은 ${info.people}명 전체 기준 원화 숫자로, total은 그 합계로 주세요.
5. 현실적인 시세 기반으로 추정하고, 모든 텍스트는 한국어로 귀엽고 친근하게 작성하세요.

반드시 아래 JSON 형식만 출력하세요:
{
  "plans": [
    {
      "title": "일정 이름(이모지 1개 포함)",
      "concept": "한두 문장 컨셉 설명",
      "route": ["방문 순서대로 여행지 이름"],
      "days": [
        {"day": 1, "title": "그날의 테마", "stops": [{"time": "09:00", "place": "장소", "activity": "할 일 한 문장"}]}
      ],
      "transport": [
        {"segment": "A → B", "mode": "교통수단", "duration": "소요시간", "cost_per_person": 0, "note": "팁(선택)"}
      ],
      "costs": {"transport": 0, "lodging": 0, "food": 0, "activities": 0, "total": 0},
      "tips": ["꿀팁 1", "꿀팁 2"]
    }
  ]
}`;
}

let samplePromise = null;
function getSample(){
  if(!samplePromise) samplePromise = (window.claude && window.claude.use) ? window.claude.use('sample') : Promise.resolve(null);
  return samplePromise;
}
async function callAI(info){
  const sample = await getSample();
  if(!sample) throw new Error('AI 추천 기능을 쓸 수 없는 환경이에요. claude.ai에서 이 페이지를 열어 주세요. (예시 미리보기는 가능해요!)');
  const prompt = '당신은 동선과 예산 계산에 능한 친절한 여행 플래너입니다.\n\n' + buildPrompt(info);
  let data;
  try{
    data = await sample.json(prompt, {modelTier:'default'});
  }catch(e){
    if(e && e.code === 'not_granted') throw new Error('AI 사용 권한이 허용되지 않았어요. 다시 눌러서 허용해 주세요.');
    if(e && e.code === 'rate_limited') throw new Error('요청이 잠시 많아요. 조금 뒤에 다시 시도해 주세요.');
    throw new Error((e && e.message) || 'AI 응답을 받지 못했어요.');
  }
  if(typeof data === 'string'){ try{ data = JSON.parse(data); }catch(_){} }
  if(!data || !data.plans || !data.plans.length) throw new Error('일정을 받아오지 못했어요. 한 번 더 눌러 주세요!');
  return data;
}

/* ---------- 렌더 ---------- */
function renderPlan(p, idx, people){
  const cls = idx === 0 ? 'p1' : 'p2';
  const deco = idx === 0 ? '🚀' : '🌿';
  const route = (p.route||[]).map(r=>`<span class="stop">${esc(r)}</span>`).join('<span class="arrow">➜</span>');
  const days = (p.days||[]).map(d=>`
    <div class="day" data-day="D${esc(d.day)}">
      <h3>${esc(d.title||'')}</h3>
      ${(d.stops||[]).map(s=>`
        <div class="stop-item">
          <div class="time">${esc(s.time)}</div>
          <div><b>${esc(s.place)}</b><small>${esc(s.activity)}</small></div>
        </div>`).join('')}
    </div>`).join('');
  const tr = (p.transport||[]).map(t=>`
    <div class="tr">
      <div class="ico">${modeIcon(t.mode)}</div>
      <div><div class="seg">${esc(t.segment)}</div><small>${esc(t.mode)}${t.duration?' · '+esc(t.duration):''}${t.note?' · '+esc(t.note):''}</small></div>
      <div class="price">${won(t.cost_per_person)}<small style="display:block;text-align:right;font-family:'Gowun Dodum'">1인</small></div>
    </div>`).join('');
  const c = p.costs || {};
  const sum = ['transport','lodging','food','activities'].reduce((a,k)=>a+(+c[k]||0),0);
  const total = +c.total || sum;
  const perPerson = people > 0 ? total / people : total;
  const tips = (p.tips||[]).length ? `<div class="tips"><b>💡 꿀팁</b><br>${p.tips.map(t=>'· '+esc(t)).join('<br>')}</div>` : '';

  return `
  <article class="plan ${cls}">
    <div class="plan-head">
      <div class="deco">${deco}</div>
      <span class="tag">일정 ${idx+1}</span>
      <h2>${esc(p.title)}</h2>
      <p>${esc(p.concept)}</p>
    </div>
    <div class="plan-body">
      ${route ? `<div class="route">${route}</div>` : ''}
      <div class="section-title">🗺️ 일자별 일정</div>
      ${days}
      <div class="section-title">🚦 추천 교통수단</div>
      <div class="tr-list">${tr}</div>
      <div class="section-title">💰 예상 금액 <small style="font-family:'Gowun Dodum';font-size:13px;color:var(--soft)">(${people}명 기준)</small></div>
      <div class="cost-grid">
        <div class="cost"><div class="e">🚌</div><div class="l">교통</div><div class="v">${won(+c.transport)}</div></div>
        <div class="cost"><div class="e">🏨</div><div class="l">숙박</div><div class="v">${won(+c.lodging)}</div></div>
        <div class="cost"><div class="e">🍜</div><div class="l">식비</div><div class="v">${won(+c.food)}</div></div>
        <div class="cost"><div class="e">🎡</div><div class="l">관광·입장</div><div class="v">${won(+c.activities)}</div></div>
      </div>
      <div class="total">
        <div class="l">총 예상 경비</div>
        <div style="text-align:right"><div class="v">${won(total)}</div><small>1인당 약 ${won(perPerson)}</small></div>
      </div>
      ${tips}
    </div>
  </article>`;
}

function render(data, info){
  $('result').innerHTML =
    `<h2 class="jua" style="text-align:center;font-size:30px;margin:6px 0 20px">🎉 ${esc(info.dests.join(' · '))} 여행 일정이 나왔어요!</h2>` +
    data.plans.slice(0,2).map((p,i)=>renderPlan(p,i,info.people)).join('');
  confetti();
  $('result').scrollIntoView({behavior:'smooth', block:'start'});
}

/* ---------- 입력 수집 ---------- */
function collect(){
  return {
    origin: $('origin').value.trim(),
    days: Math.max(1, +$('days').value || 1),
    people: Math.max(1, +$('people').value || 1),
    date: $('date').value,
    style: $('style').value,
    dests: [...list.querySelectorAll('input')].map(i=>i.value.trim()).filter(Boolean)
  };
}

/* ---------- 실행 ---------- */
const msgs = ['짐 싸는 중...','여권 챙기는 중... 🛂','최적 동선 그리는 중... 🗺️','교통편 비교하는 중... 🚄','맛집 찜하는 중... 🍜','경비 계산하는 중... 💰'];
let msgTimer;
getSample();
function setLoading(on){
  $('loading').classList.toggle('on', on);
  $('goBtn').disabled = on;
  clearInterval(msgTimer);
  if(on){ let i=0; $('loadMsg').textContent = msgs[0]; msgTimer = setInterval(()=>{ i=(i+1)%msgs.length; $('loadMsg').textContent = msgs[i]; }, 1600); }
}
function showError(m){ $('error').textContent = m; $('error').classList.toggle('on', !!m); }

$('goBtn').onclick = async ()=>{
  showError('');
  const info = collect();
  if(!info.dests.length){ showError('📍 여행지를 최소 1곳 이상 입력해 주세요!'); return; }
  $('result').innerHTML = '';
  setLoading(true);
  try{
    const data = await callAI(info);
    render(data, info);
  }catch(e){
    let m = e.message || String(e);
        if(e instanceof SyntaxError) m = 'AI 응답을 해석하지 못했어요. 한 번 더 눌러 주세요!';
    showError('😢 ' + m);
  }finally{ setLoading(false); }
};
